<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manga Studio Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <h1>Manga Studio <span class="badge">Mobile</span></h1>
      </div>
      <button id="btnSettings" class="icon-btn" title="Configurações">⚙️</button>
    </header>

    <main class="main-content">
      <section class="card">
        <h2>📁 Selecionar Mangá</h2>
        <p class="subtitle">Escolha uma pasta no armazenamento do seu celular:</p>
        
        <div class="folder-selector">
          <select id="folderSelect">
            <option value="">Carregando pastas do celular...</option>
          </select>
          <button id="btnRefreshFolders" class="secondary-btn">🔄</button>
        </div>

        <div class="custom-path-group">
          <label for="customPath">Ou digite o caminho da pasta:</label>
          <input type="text" id="customPath" placeholder="/sdcard/MANGAS/MeuManga">
        </div>

        <button id="btnTranslate" class="action-btn">🚀 Iniciar Tradução</button>
      </section>

      <section id="progressCard" class="card progress-card hidden">
        <h2>⏳ Status da Tradução</h2>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span id="progressCount">0 / 0</span>
          <span id="progressPercent">0%</span>
        </div>
        <p id="progressMessage" class="status-msg">Preparando...</p>
        <div id="resultBox" class="result-box hidden"></div>
      </section>
    </main>

    <!-- Modal de Configurações -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ Chaves de API</h3>
          <button id="btnCloseModal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <label for="geminiKey">Chave Google Gemini Vision (Recomendada):</label>
          <input type="password" id="geminiKey" placeholder="AIzaSy...">
          <small>Usada para ler balões e traduzir com zero consumo de RAM no celular.</small>

          <label for="groqKey" style="margin-top: 14px;">Chave Groq API (Opcional):</label>
          <input type="password" id="groqKey" placeholder="gsk_...">
          
          <button id="btnSaveConfig" class="action-btn" style="margin-top: 20px;">💾 Salvar Chaves</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
