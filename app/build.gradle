plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mangastudio.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.mangastudio.mobile"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "1.0.15-mobile"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "flask"
                install "requests"
                install "pillow"
            }
        }
    }

    // Assinatura FIXA (keystore nos Secrets do GitHub). Sem ela, cada build do CI gera uma chave
    // de debug nova e o Android recusa instalar por cima ("App não instalado").
    def ciKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        stable {
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (ciKeystore) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            if (ciKeystore) {
                signingConfig signingConfigs.stable
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Login do Google para ler o Google Drive (AuthorizationClient)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
