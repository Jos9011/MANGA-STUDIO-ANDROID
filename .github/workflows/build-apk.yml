name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🔑 Restaurar keystore fixa (permite instalar por cima da versão anterior)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mangastudio.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mangastudio.jks" >> "$GITHUB_ENV"
            echo "Keystore fixa restaurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ausente: APK assinado com chave de debug temporária (não instala por cima da versão anterior)."
          fi

      - name: 🚀 Compilar APK (assembleDebug)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.15.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.15-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.15-mobile
          name: "Manga Studio Mobile v1.0.15 APK (v0.8.1 Beta — tradução com contexto)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.15 — Sistema Oficial v0.8.1 Beta

            ### 🧠 Tradução com contexto
            - Cada página vai para a IA com as últimas falas já traduzidas das páginas anteriores: tom, nomes e gênero de quem fala ficam coerentes.
            - Quando TODAS as IAs ficam sem cota, a página espera a cota renovar e é traduzida depois, em vez de ficar no idioma original. Mantenha o app aberto; Parar e Pausar continuam valendo.
            - Novo cartão **Tradução** em Configurações para escolher quantas páginas de contexto enviar e o que fazer sem cota.

            ### ☁️ Inclui a v1.0.14: Google Drive dentro do app
            - Na aba Biblioteca, toque em **Conectar Google Drive** e entre com a sua conta Google (permissão somente de leitura).
            - O app lista as pastas e os arquivos `.zip`/`.cbz` da pasta **MANGAS** do seu Drive, com a mesma busca da Biblioteca.
            - **⬇️ Baixar** copia a obra para o celular (`/sdcard/MANGAS`); depois é só tocar em **⚡ Traduzir**.
            - Para o login funcionar, o APK precisa ser assinado com a chave fixa cadastrada no Google Cloud.

            ### 🔎 Busca na Biblioteca
            - Campo de busca fixo no topo da aba Biblioteca, que procura nas obras traduzidas e nas originais.
            - Ignora maiúsculas, acentos e pontuação e aceita as palavras em qualquer ordem: "gal kuro" ou "toshiue ch1" encontram "Toshiue no Kuro Gal ... Ch.1".
            - Mostra quantas obras foram encontradas, avisa quando nada foi encontrado e tem botão ✕ para limpar.

            ### 📒 Inclui a v1.0.12
            - Ficha da Obra + Líder do capítulo: nomes e gêneros dos personagens iguais em todos os capítulos (mesmo arquivo `.fichas_obra/` do PC/Colab).
            - IA Vision instruída a não deixar palavras em inglês.

            ### 🛠️ Inclui as correções da v1.0.11
            - Páginas WebP/AVIF/HEIC abertas pelo decodificador nativo do Android; falhas por página visíveis no log; fallback entre provedores.

            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Se for a primeira versão com assinatura fixa, desinstale a anterior uma única vez; depois disso as atualizações instalam por cima.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
