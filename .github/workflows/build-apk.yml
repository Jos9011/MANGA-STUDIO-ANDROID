name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🔑 Restaurar keystore fixa (permite instalar por cima da versão anterior)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mangastudio.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mangastudio.jks" >> "$GITHUB_ENV"
            echo "Keystore fixa restaurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ausente: APK assinado com chave de debug temporária (não instala por cima da versão anterior)."
          fi

      - name: 🚀 Compilar APK (assembleDebug)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.12.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.12-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.12-mobile
          name: "Manga Studio Mobile v1.0.12 APK (v0.7.8 Beta — Ficha da Obra e anti-inglês residual)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.12 — Sistema Oficial v0.7.8 Beta

            ### 📒 Ficha da Obra + Líder do capítulo (novo no celular)
            - Antes de cada capítulo, o app carrega a ficha da obra (nomes em PT-BR e gênero dos personagens) e manda junto para a IA Vision, para os nomes e gêneros ficarem iguais em todos os capítulos.
            - No fim do capítulo, o Líder (`openai/gpt-oss-120b` no Groq, ou Gemini/OpenRouter) lê as falas originais e acrescenta à ficha os personagens e termos novos. Apelidos vão na nota do personagem; palpites ("possível...") são descartados.
            - Mesmo formato e mesmo arquivo do PC/Colab: `.fichas_obra/<nome da obra>.json`, na pasta que contém os capítulos ("Obra Ch.1", "Obra Ch.2" usam a mesma ficha).
            - Desligar: `"ficha_obra": false` nas configurações; só o Líder: `"lider_capitulo": false`.

            ### 🇺🇸 Sem inglês residual
            - A IA Vision é instruída a traduzir todas as palavras, inclusive as em negrito, e a ignorar efeitos sonoros desenhados e créditos de scan.

            ### 🛠️ Inclui as correções da v1.0.11
            - Páginas WebP/AVIF/HEIC abertas pelo decodificador nativo do Android; falhas por página visíveis no log; fallback entre provedores.

            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Se for a primeira versão com assinatura fixa, desinstale a anterior uma única vez; depois disso as atualizações instalam por cima.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
