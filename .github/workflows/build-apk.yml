name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.1.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.1-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.1-mobile
          name: "Manga Studio Mobile v1.0.1 APK (Interface Original & Google Drive)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.1 (APK Android)
            
            Atualização com a interface completa do Manga Studio original e suporte nativo ao Google Drive!
            
            ### ✨ O que há de novo nesta versão:
            - 🎨 **Interface Original Manga Studio**: O mesmo dashboard Cyberpunk do PC/Colab com biblioteca de mangás, capas de visualização rápida e reprodutor interativo.
            - ☁️ **Acesso Direto ao Google Drive & Memória**: Escaneamento automático de `/sdcard/Download`, `/storage/emulated/0/MANGAS`, Google Drive sincronizado e seletor nativo de arquivos Android.
            - 🚀 **IA Otimizada para Celular**: IA Local pesada (Ollama) desativada para poupar memória e bateria do aparelho; processamento acelerado por APIs de Nuvem (Gemini Vision / Groq).
            - 📖 **Leitor Web Imersivo Integrado**: Abra e leia seus mangás traduzidos diretamente no app ou exporte pacotes `.CBZ` para o Tachiyomi/Mihon.
            
            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu smartphone Android.
            2. Toque no arquivo baixado e permita a instalação.
            3. Ao abrir, insira sua chave do Google Gemini no menu de Configurações (⚙️) para traduzir com IA.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
