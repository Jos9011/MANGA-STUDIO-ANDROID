name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.9.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.9-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.9-mobile
          name: "Manga Studio Mobile v1.0.9 APK (v0.7.3 Beta — Suporte a Gemini 3.1 Flash Lite & Chaves AQ)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.9 — Sistema Oficial v0.7.3 Beta

            Integração nativa dos novos modelos Gemini 3.1 Flash Lite e suporte completo a chaves Google AI Studio com prefixo `AQ.` para o OCR IA Vision Híbrido!

            ### 🚀 Novidades e Otimizações desta Versão:
            - 👁️ **Suporte a Gemini 3.1 Flash Lite:** Atualizados os modelos prioritários de visão para `gemini-3.1-flash-lite` e `gemini-3.5-flash-lite`, contornando a depreciação de modelos legados (2.5/2.0-flash) e garantindo respostas instantâneas no OCR Vision.
            - 🔑 **Compatibilidade com Chaves `AQ.`:** Reconhecimento nativo das novas chaves de API do Google AI Studio com prefixo `AQ.` sem falso aviso de validação.
            - 🛡️ **Proteção Anti-Vazamento P&B:** Preservação integral de desenhos, rostos e cabelos brancos em mangás sem cor.
            - ⚡ **Cotas Reais ao Vivo (Groq, OpenRouter e Gemini):** Monitoramento paralelo das chaves e uso de tokens.

            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Instale por cima da versão anterior e aproveite!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
