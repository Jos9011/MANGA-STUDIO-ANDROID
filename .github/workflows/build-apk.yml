name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.2.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.2-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.2-mobile
          name: "Manga Studio Mobile v1.0.2 APK (Correção Python 3.11 & Interface Original)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.2 (APK Android)
            
            Versão com correção de compatibilidade para o interpretador Python 3.11 no Android.
            
            ### 🐛 Correção Aplicada:
            - **Resolução de SyntaxError no Python 3.11**: Corrigida a expressão f-string com escape de barra invertida em `mobile_routes_translation.py`, permitindo a inicialização instantânea do servidor sem erros.
            
            ### ✨ Recursos:
            - 🎨 **Interface Original Cyberpunk**: Dashboard completo do Manga Studio idêntico ao desktop/Colab.
            - ☁️ **Acesso ao Google Drive & Memória**: Escaneamento de `/storage/emulated/0/Download`, `/sdcard/MANGAS` e seletor nativo do Android.
            - 🚀 **Sem IA Local Pesada**: Zero consumo excessivo de RAM/bateria; tradução ultrarrápida via Gemini Vision / Groq.
            - 📖 **Leitor Web Imersivo**: Leitor responsivo integrado diretamente no aplicativo.
            
            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu aparelho.
            2. Instale a atualização e abra o aplicativo normalmente.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
