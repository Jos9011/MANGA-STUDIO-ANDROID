name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.8.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.8-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.8-mobile
          name: "Manga Studio Mobile v1.0.8 APK (v0.7.2 Beta — Proteção Anti-Vazamento em Mangás P&B)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.8 — Sistema Oficial v0.7.2 Beta

            Proteção matemática anti-vazamento para mangás Preto e Branco (P&B), preservando 100% de rostos, olhos, bocas e cabelos brancos quando balões sem borda encostam no personagem!

            ### 🛡️ Correção Crítica desta Versão:
            - 🎨 **Trava Anti-Vazamento P&B (`mobile_balloon_cleaner.py`):** Impede que o flood-fill de balões brancos abertos/nuvem vaze para cabelos ou pele branca em mangás sem cor, verificando lados abertos, proporção de furos internos (`holes_ratio`), taxa de preenchimento e limite de área em relação à caixa OCR. Em caso de vazamento detectado, aplica limpeza cirúrgica restrita à caixa do texto — preservando o desenho intacto.

            ### ✨ Recursos Incluídos:
            - ⚡ **Cotas Reais ao Vivo (Todas as Chaves):** Consulta paralela de chaves Groq, OpenRouter e Gemini com barras reais de RPD/TPM.
            - 🖼️ **Capas Nativas à Prova de Falhas:** Suporte a capas em ZIP/WebP/PNG/JPG com fallback nativo para WebView Android.
            - ☁️ **Seletor Google Drive SAF (`ACTION_OPEN_DOCUMENT`):** Seleção direta de `.zip`, `.cbz`, `.json` e imagens no Google Drive.
            - 🧹 **Varredura de Cavidade de Balões Fechados + Fontes Profissionais PT-BR + Pausar/Parar Tradução.**

            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Instale por cima da versão anterior e aproveite!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
