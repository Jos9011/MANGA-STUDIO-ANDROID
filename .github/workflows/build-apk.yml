name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.7.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.7-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.7-mobile
          name: "Manga Studio Mobile v1.0.7 APK (v0.7.1 Beta — Cotas Reais, Capas Nativas WebP/ZIP & Seletor Google Drive SAF)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.7 — Sistema Oficial v0.7.1 Beta

            Correções críticas para Cotas em Tempo Real, Capas de Mangás em ZIP/WebP e Seletor Nativo do Google Drive!

            ### ✨ Correções desta Versão:
            - ⚡ **Cotas Reais ao Vivo (Todas as Chaves):** Novo módulo `mobile_quota_checker.py` que consulta em paralelo todas as chaves Groq, OpenRouter e Gemini, exibindo barras reais de RPD/TPM e ocultando erros falsos de chaves não configuradas.
            - 🖼️ **Capas Nativas à Prova de Falhas:** Novo `mobile_thumb_helper.py` com compatibilidade Pillow + entrega direta de bytes WebP/PNG/JPG para a WebView Chromium quando o codec Pillow falhar no Android.
            - ☁️ **Seletor Google Drive SAF (`ACTION_OPEN_DOCUMENT`):** Permite selecionar arquivos `.zip`, `.cbz`, `.json` e imagens diretamente do Google Drive sem travar ou acinzentar arquivos, além de sanitizar nomes de arquivos vindos do Drive no upload.

            ### ✨ Novidades desta Versão:
            - 🧹 **Varredura Completa da Cavidade do Balão (Pillow Puro):** Detecta o interior fechado de cada balão branco sem pesar na RAM, apagando 100% de letras órfãs e resíduos (`I`, traços coloridos/cinzas) mantendo a borda preta intacta.
            - 🔤 **Fontes Profissionais de Scanlation + Tipografia PT-BR Calibrada:** Fontes `Anime Ace`, `Komika` e `Shout` embutidas no APK, medição real de acentos maiúsculos (`ÁÇÃÊÓÚg`) sem colisão entre linhas e sem hifenizações feias em palavras curtas.
            - ⏸️ **Controles de Pausar / Retomar e Parar Tradução:** Pause ou interrompa a tradução a qualquer momento preservando as páginas já traduzidas no leitor offline.
            - 📚 **Biblioteca sem Duplicatas:** Resolução de *symlinks* do Android (`/sdcard` ↔ `/storage/emulated/0`) e deduplicação automática entre pasta descompactada e `.cbz`.
            - 🔑 **Importar / Exportar Perfil Seguro:** Impede exportação de backup vazio sem aviso e nunca sobrescreve chaves válidas com listas vazias `[]`.
            - 🌐 **Pronome `"I"` → `"Eu"`:** Prompt calibrado para sempre traduzir `"I"` corretamente em PT-BR.

            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Instale por cima da versão anterior e aproveite!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
