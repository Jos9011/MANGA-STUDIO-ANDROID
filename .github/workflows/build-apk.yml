name: 📱 Compilar Manga Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: 📦 Preparar APK Final
        run: |
          mkdir -p build/outputs/apk/
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/apk/MangaStudio-Mobile-v1.0.4.apk || true

      - name: 📤 Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Mobile-v1.0.4-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🏷️ Criar Release no GitHub com Download Direto do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.4-mobile
          name: "Manga Studio Mobile v1.0.4 APK (Groq Vision, Scroll Fluido & Correção de Capas)"
          body: |
            ## 📱 Manga Studio Mobile v1.0.4 (APK Android)
            
            Versão com correções completas para Gestos de Rolagem, Importação de Perfil de PC e Suporte a Groq Vision!
            
            ### ✨ Principais Correções e Melhorias:
            - 📜 **Scroll Fluido e Responsivo**: Removido o interceptor de gestos nativo do Android (`SwipeRefreshLayout`), permitindo rolagem livre (subir e descer) em qualquer ponto da biblioteca e do leitor.
            - ⚡ **Suporte Nativo a Groq Vision & OpenRouter**: O motor de tradução agora suporta Groq Vision (`qwen/qwen3.8-27b`, `llama-3.2-11b-vision-preview`), OpenRouter e Gemini Vision com rotação automática de chaves da sua lista.
            - 🔄 **Importação de Perfil do PC Sanitizada**: Ao importar `config.json` do seu computador, o app ignora caminhos com letras de unidade Windows (`C:\...`) para preservar o armazenamento do celular e sincroniza perfeitamente as chaves `groq_api_keys`.
            - 🖼️ **Correção nas Capas dos Mangás**: As miniaturas agora contam com fallback instantâneo para o logo do Manga Studio quando o caminho original não puder ser lido, eliminando ícones quebrados na biblioteca.
            - 🛡️ **Garantia de Páginas no Leitor**: Caso alguma página sofra oscilação de rede ou cota durante a tradução, a página original é mantida como fallback, garantindo que o capítulo completo seja gerado junto com o `leitor.html` e o `.cbz`.
            
            ### 📥 Como instalar:
            1. Baixe o arquivo `app-debug.apk` abaixo no seu celular.
            2. Instale a atualização e aproveite a leitura e tradução sem bugs!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
